services:
  postgres:
    image: postgres:16-alpine
    container_name: pawlink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pawlink
      POSTGRES_PASSWORD: pawlink
      POSTGRES_DB: pawlink
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawlink -d pawlink"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
