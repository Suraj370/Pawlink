# Fly.io app config for the API only (apps/api). The frontend (apps/web)
# deploys separately to Vercel — see docs/architecture.md, "Deployment."
#
# Built from the repo root (this is an npm-workspaces monorepo; apps/api
# depends on packages/shared, so the Docker build needs the whole tree —
# see apps/api/Dockerfile's own header comment). fly.toml at the repo
# root makes the repo root the build context, matching that requirement.
#
# `app` is placeholder — `fly launch` will prompt to rename/claim it, or
# set it yourself before running `fly deploy`.
app = "pawlink-api"
primary_region = "iad"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # DATABASE_URL, REDIS_URL, MOCK_PAYMENT_WEBHOOK_SECRET, WEB_ORIGIN are
  # secrets — set via `fly secrets set`, never committed here.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"
